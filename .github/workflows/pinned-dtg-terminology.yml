name: Extract pinned DTG specification terminology

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/extract_spec_up_t_terms.py'
      - 'tools/build_pinned_dtg_inventory.py'
      - '.github/workflows/pinned-dtg-terminology.yml'
      - 'governance/coverage/pinned-dtg-spec-term-trees.json'
  push:
    branches: [ main ]
    paths:
      - 'tools/extract_spec_up_t_terms.py'
      - 'tools/build_pinned_dtg_inventory.py'
      - '.github/workflows/pinned-dtg-terminology.yml'
      - 'governance/coverage/pinned-dtg-spec-term-trees.json'

permissions:
  contents: read

jobs:
  extract-pinned-terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tig
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trustoverip/dtgwg-cred-spec
          ref: 4088056a15f6e74847eb422e1c2bae33684272ea
          path: sources/credentials
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trustoverip/dtgwg-vti-spec
          ref: dc1ec07d42ec5c0054037795c06dbead608fbc5b
          path: sources/vti
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trustoverip/dtgwg-trust-tasks-spec
          ref: bf667f3e8506b7fb2c3e96665b7060e2ebaad806
          path: sources/tasks
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source revisions and extract terms
        run: |
          python tig/tools/build_pinned_dtg_inventory.py \
            --manifest tig/governance/coverage/pinned-dtg-spec-term-trees.json \
            --sources-root sources \
            --output dtg-evidence/pinned-terminology.json
      - name: Upload pinned source evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-pinned-dtg-terminology
          path: dtg-evidence/pinned-terminology.json
