name: Build and Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml jsonschema

      - name: Validate glossary and semantic model
        run: |
          python tools/validate_governance_glossary.py
          python tools/validate_profiles.py
          python tools/validate_semantic_model.py

      - name: Generate machine-readable bundles
        run: |
          python tools/build_governance_glossary.py
          python tools/build_semantic_model.py

      - name: Generate governance quality report
        run: python tools/build_quality_report.py

      - name: Generate public information architecture
        run: |
          python tools/build_jekyll_site.py
          python tools/build_site_information_architecture.py
          python tools/validate_site_ia.py

      - name: Verify generated artifacts are in sync
        run: git diff --exit-code -- . ':!docs/'

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
