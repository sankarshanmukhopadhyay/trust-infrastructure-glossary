name: Validate Trust Infrastructure Glossary

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  validate-governance-glossary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate and regenerate glossary artifacts
        run: |
          python tools/validate_governance_glossary.py
          python tools/validate_profiles.py
          python tools/validate_semantic_model.py
          python tools/build_governance_glossary.py
          python tools/build_quality_report.py
          python tools/build_semantic_model.py
          python tools/build_jekyll_site.py

      - name: Upload semantic model evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-semantic-model
          path: |
            generated/json/tig-taxonomy.json
            generated/json/tig-ontology.jsonld
            generated/rdf/tig-ontology.ttl

      - name: Fail if tracked generated artifacts drifted
        run: |
          git diff --exit-code -- . ':!docs/'
