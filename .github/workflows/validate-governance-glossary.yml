name: Validate Trust Infrastructure Glossary

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  validate-governance-glossary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate and regenerate glossary artifacts
        run: |
          python tools/validate_governance_glossary.py
          python tools/validate_profiles.py
          python tools/validate_semantic_model.py
          python tools/build_governance_glossary.py
          python tools/build_quality_report.py
          python tools/build_semantic_model.py
          python tools/build_jekyll_site.py
          python tools/build_site_information_architecture.py
          python tools/validate_site_ia.py

      - name: Validate source crosswalk pilot and negative fixtures
        run: |
          python tools/validate_source_crosswalk.py
          python -m unittest discover -s tests -p 'test_source_crosswalk.py' -v
          python tools/report_source_crosswalk_discovery.py --output /tmp/tig-crosswalk-discovery.json
          python tools/build_source_review_queue.py --output /tmp/tig-review-queue.json
          python -m unittest discover -s tests -p 'test_source_review_queue.py' -v
          python -m unittest discover -s tests -p 'test_extract_spec_up_t_terms.py' -v
          python -m unittest discover -s tests -p 'test_semantic_first_pass.py' -v

      - name: Upload lexical discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-crosswalk-lexical-discovery
          path: /tmp/tig-crosswalk-discovery.json

      - name: Upload semantic review queue evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-source-semantic-review-queue
          path: /tmp/tig-review-queue.json

      - name: Upload semantic model evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-semantic-model
          path: |
            generated/json/tig-taxonomy.json
            generated/json/tig-ontology.jsonld
            generated/rdf/tig-ontology.ttl

      - name: Upload site IA evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-site-information-architecture
          path: |
            explore/taxonomy.md
            explore/relationships.md

      - name: Fail if tracked generated artifacts drifted
        run: |
          git diff --exit-code -- . ':!docs/'
