name: Validate Trust Infrastructure Glossary

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  validate-governance-glossary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate and regenerate glossary artifacts
        run: |
          python tools/validate_governance_glossary.py
          python tools/validate_profiles.py
          python tools/validate_semantic_model.py
          python tools/build_governance_glossary.py
          python tools/build_quality_report.py
          python tools/build_semantic_model.py
          python tools/build_jekyll_site.py
          python tools/build_site_information_architecture.py
          python tools/validate_site_ia.py

      - name: Validate source crosswalk pilot and negative fixtures
        run: |
          python tools/validate_source_crosswalk.py
          python -m unittest discover -s tests -p 'test_source_crosswalk.py' -v
          python tools/report_source_crosswalk_discovery.py --output /tmp/tig-crosswalk-discovery.json
          python tools/build_source_review_queue.py --output /tmp/tig-review-queue.json
          python -m unittest discover -s tests -p 'test_source_review_queue.py' -v
          python -m unittest discover -s tests -p 'test_extract_spec_up_t_terms.py' -v
          python -m unittest discover -s tests -p 'test_semantic_first_pass.py' -v
          python -m unittest discover -s tests -p 'test_semantic_decision_proposals.py' -v

      - name: Validate reader-first information architecture
        run: python -m unittest discover -s tests -p 'test_consumer_navigation_ia.py' -v

      - name: Validate consumer qualification evidence
        run: |
          python tools/validate_tig_consumer_qualification.py
          python -m unittest discover -s tests -p 'test_tig_consumer_qualification.py' -v

      - name: Validate DTG intake ledger and negative fixtures
        run: |
          python -m unittest discover -s tests -p 'test_dtg_intake_readiness.py' -v
          python tools/report_dtg_intake_readiness.py --output /tmp/tig-dtg-intake-readiness.json

      - name: Qualify generated catalog consumption and negative fixtures
        run: |
          python -m unittest discover -s tests -p 'test_catalog_consumer.py' -v
          python tools/qualify_catalog_consumer.py

      - name: Verify full pinned external glossary source trees
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -p 'test_external_glossary_tree.py' -v
          python tools/inventory_external_glossary_tree.py --repository trustoverip/ctwg-main-glossary --commit 00608bb6ce7f7e6285f202b580548d61ee716621 --output /tmp/tig-toip-main-tree.json
          python tools/inventory_external_glossary_tree.py --repository trustoverip/ctwg-general-glossary --commit 73604cf54c9f238b0d239daecc413a045f61c75e --output /tmp/tig-toip-general-tree.json

      - name: Upload verified external glossary tree evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-external-glossary-pinned-source-trees
          path: |
            /tmp/tig-toip-main-tree.json
            /tmp/tig-toip-general-tree.json

      - name: Checkout pinned ToIP Main Glossary
        uses: actions/checkout@v4
        with:
          repository: trustoverip/ctwg-main-glossary
          ref: 00608bb6ce7f7e6285f202b580548d61ee716621
          path: _upstream/toip-main
          persist-credentials: false

      - name: Checkout pinned ToIP General IT Glossary
        uses: actions/checkout@v4
        with:
          repository: trustoverip/ctwg-general-glossary
          ref: 73604cf54c9f238b0d239daecc413a045f61c75e
          path: _upstream/toip-general
          persist-credentials: false

      - name: Extract pinned external definitions and aliases
        run: |
          python -m unittest discover -s tests -p 'test_external_glossary_definition_extraction.py' -v
          python tools/extract_external_glossary_definitions.py --repository trustoverip/ctwg-main-glossary --commit 00608bb6ce7f7e6285f202b580548d61ee716621 --source-root _upstream/toip-main --output /tmp/tig-toip-main-definitions.json
          python tools/extract_external_glossary_definitions.py --repository trustoverip/ctwg-general-glossary --commit 73604cf54c9f238b0d239daecc413a045f61c75e --source-root _upstream/toip-general --output /tmp/tig-toip-general-definitions.json

      - name: Build external lexical crosswalk review queue
        run: |
          python -m unittest discover -s tests -p 'test_external_glossary_crosswalk.py' -v
          python tools/build_external_glossary_crosswalk.py --catalog generated/json/trust-infrastructure-glossary.catalog.json --source /tmp/tig-toip-main-definitions.json --source /tmp/tig-toip-general-definitions.json --output /tmp/tig-external-source-crosswalk.json

      - name: Upload external crosswalk evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-external-glossary-lexical-crosswalk
          path: /tmp/tig-external-source-crosswalk.json

      - name: Upload external definition extraction evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-external-glossary-pinned-definitions
          path: |
            /tmp/tig-toip-main-definitions.json
            /tmp/tig-toip-general-definitions.json

      - name: Validate candidate external glossary pins
        run: python -m unittest discover -s tests -p 'test_external_glossary_candidate_pins.py' -v

      - name: Validate Credentials terminology source admission
        run: python -m unittest discover -s tests -p 'test_cred_spec_source_admission.py' -v

      - name: Validate concept snapshot change classification
        run: python -m unittest discover -s tests -p 'test_concept_semantic_changes.py' -v

      - name: Upload lexical discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-crosswalk-lexical-discovery
          path: /tmp/tig-crosswalk-discovery.json

      - name: Upload semantic review queue evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-source-semantic-review-queue
          path: /tmp/tig-review-queue.json

      - name: Upload semantic model evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-semantic-model
          path: |
            generated/json/tig-taxonomy.json
            generated/json/tig-ontology.jsonld
            generated/rdf/tig-ontology.ttl

      - name: Upload site IA evidence
        uses: actions/upload-artifact@v4
        with:
          name: tig-site-information-architecture
          path: |
            explore/taxonomy.md
            explore/relationships.md

      - name: Fail if tracked generated artifacts drifted
        run: |
          git diff --exit-code -- . ':!docs/'